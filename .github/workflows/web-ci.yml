name: Web CI

on:
  push:
    paths:
      - 'web/**'
  pull_request:
    paths:
      - 'web/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci || npm install

      - name: Syntax check
        working-directory: ./web
        run: node -c src/app.js

      - name: Build
        working-directory: ./web
        run: npm run build
